[pytest]
# Pytest configuration for AirportWaze Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Enable strict markers
    --strict-markers
    # Show warnings
    -W default
    # Coverage options
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    # Fail if coverage is below threshold (optional, can adjust)
    --cov-fail-under=70
    # Performance options
    --maxfail=5
    --tb=short

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers for categorizing tests
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require database/external services
    slow: Tests that take a long time to run
    api: API endpoint tests
    auth: Authentication and authorization tests
    database: Database-related tests
    cache: Redis cache tests
    external: Tests requiring external API calls

# Console output options
console_output_style = progress

# Timeout for tests (in seconds)
timeout = 300
timeout_method = thread

# Filter warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:passlib

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Pytest-asyncio configuration
[tool:pytest]
asyncio_mode = auto
